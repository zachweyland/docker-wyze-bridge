{% extends 'base.html' %}

{% block stylesheet %}
<style>
.login-wrap {
    max-width: 420px;
    margin: 3rem auto;
    padding: 2rem;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.login-wrap h2 { font-size: 1.1rem; margin-bottom: 1.5rem; color: var(--text); }

.tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
}
.tab-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    font-family: inherit;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
}
.tab-btn.active { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 0.3rem; }
.form-group input {
    width: 100%;
    padding: 0.55rem 0.8rem;
    background: #0d1b2a;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
}
.form-group input:focus { outline: none; border-color: var(--accent-bright); }

.info-box {
    padding: 0.7rem 0.8rem;
    background: rgba(83,144,217,0.08);
    border-radius: 4px;
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 1rem;
}
.info-box a { color: var(--accent-bright); }

.submit-btn {
    width: 100%;
    padding: 0.65rem;
    background: var(--success);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
    margin-top: 0.25rem;
}
.submit-btn:disabled { opacity: 0.6; cursor: default; }

.msg { padding: 0.75rem 0.9rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.85rem; }
.msg.success { background: rgba(76,175,80,0.12); color: var(--success); }
.msg.danger  { background: rgba(244,67,54,0.12); color: var(--error); }

form.hidden { display: none; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
    <h2>Sign in to Wyze Bridge</h2>

    <div class="tab-bar">
        <button class="tab-btn active" data-target="apiLogin">API Key</button>
        <button class="tab-btn" data-target="tokenLogin">Token</button>
    </div>

    <form id="apiLogin">
        <div class="error"></div>
        <div class="info-box">
            API Key and ID from the
            <a href="https://developer-api-console.wyze.com/#/apikey/view" target="_blank">Wyze Developer Portal</a>.
        </div>
        <div class="form-group">
            <label>Email</label>
            <input name="email" type="email" placeholder="you@example.com" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input name="password" type="password" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label>API ID</label>
            <input name="keyId" type="text" placeholder="36-character key ID" pattern="[a-fA-F0-9-]{36}" required>
        </div>
        <div class="form-group">
            <label>API Key</label>
            <input name="apiKey" type="text" placeholder="60-character API key" pattern="[a-zA-Z0-9]{60}" required>
        </div>
        <button type="submit" class="submit-btn">Sign in</button>
    </form>

    <form id="tokenLogin" class="hidden">
        <div class="error"></div>
        <div class="form-group">
            <label>Access Token</label>
            <input name="tokens" type="text" placeholder="access token">
        </div>
        <div class="form-group">
            <label>Refresh Token</label>
            <input name="refresh" type="text" placeholder="refresh token">
        </div>
        <button type="submit" class="submit-btn">Sign in</button>
    </form>
</div>
{% endblock %}

{% block javascript %}
<script>
(function () {
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var target = btn.getAttribute('data-target');
            document.querySelectorAll('form').forEach(function (f) { f.classList.toggle('hidden', f.id !== target); });
            document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b === btn); });
        });
    });

    // Form submission
    document.querySelectorAll('form').forEach(function (form) {
        var btn = form.querySelector('.submit-btn');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Signing in…';
            fetch('login', { method: 'POST', body: new FormData(form) })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.status === 'success') {
                        form.innerHTML = '<div class="msg success">Login successful — redirecting…</div>';
                        setTimeout(function () { window.location = '.'; }, 3000);
                    } else {
                        btn.disabled = false;
                        btn.textContent = 'Sign in';
                        form.querySelector('.error').innerHTML = '<div class="msg danger">' + data.status + '. Please try again.</div>';
                    }
                })
                .catch(function (e) { console.error(e); btn.disabled = false; btn.textContent = 'Sign in'; });
        });
    });
})();
</script>
{% endblock %}
